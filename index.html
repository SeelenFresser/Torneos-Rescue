<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rescue TCG — Torneos</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Fix fondo blanco de imágenes JPEG */
  .auth-bunny {
    mix-blend-mode: screen;
    filter: drop-shadow(0 8px 32px rgba(255,45,138,0.6)) contrast(1.05);
  }
  .auth-logo img {
    mix-blend-mode: screen;
    filter: contrast(1.1) brightness(1.05);
  }
  .nav-logo img {
    mix-blend-mode: screen;
    filter: contrast(1.1);
    background: transparent;
  }
</style>
</head>
<body>

<!-- ===================== AUTH ===================== -->
<div id="screen-auth" class="screen">
  <div class="auth-wrap">
    <img class="auth-bunny" src="img/mad-bunny.jpeg" alt="Mad Bunny">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="img/logo.jpeg" alt="Rescue TCG">
      </div>
      <p class="auth-title">Plataforma oficial de torneos</p>
      <div class="tab-row" id="auth-tabs">
        <button class="tab active" onclick="switchAuthTab('login')">Iniciar sesión</button>
        <button class="tab" onclick="switchAuthTab('register')">Registrarse</button>
      </div>
      <div id="auth-login">
        <input class="input" id="login-email" type="email" placeholder="Correo electrónico">
        <input class="input" id="login-pass" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="btn btn-primary w-full" onclick="doLogin()">Entrar</button>
      </div>
      <div id="auth-register" style="display:none">
        <input class="input" id="reg-name" type="text" placeholder="Tu nombre o alias">
        <input class="input" id="reg-email" type="email" placeholder="Correo electrónico">
        <input class="input" id="reg-pass" type="password" placeholder="Contraseña (mín. 6 caracteres)" onkeydown="if(event.key==='Enter')doRegister()">
        <button class="btn btn-primary w-full" onclick="doRegister()">Crear cuenta</button>
      </div>
      <p class="auth-error" id="auth-error"></p>
    </div>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="screen-dashboard" class="screen">
  <nav class="navbar">
    <div class="nav-logo">
      <img src="img/logo.jpeg" alt="Rescue TCG">
      <span class="nav-logo-text">Rescue TCG</span>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="nav-username"></span>
      <span class="nav-role" id="nav-role" style="display:none">Admin</span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Salir</button>
    </div>
  </nav>
  <div class="container">
    <div class="page-header">
      <h2>🏆 Torneos</h2>
      <button class="btn btn-primary" id="btn-new-tournament" style="display:none" onclick="openNewTournamentModal()">+ Nuevo torneo</button>
    </div>
    <div id="tournament-list" class="tournament-grid">
      <div class="empty-state">Cargando torneos...</div>
    </div>
  </div>
</div>

<!-- ===================== TOURNAMENT ADMIN VIEW ===================== -->
<div id="screen-tournament" class="screen">
  <nav class="navbar">
    <button class="btn btn-ghost btn-sm" onclick="goToDashboard()">← Volver</button>
    <div class="nav-logo">
      <img src="img/logo.jpeg" alt="Rescue TCG">
      <span class="nav-logo-text" id="t-name-nav">Torneo</span>
    </div>
    <div class="nav-right">
      <span class="badge" id="t-type-badge"></span>
    </div>
  </nav>
  <div class="container" id="tournament-content"></div>
</div>

<!-- ===================== GAME APP (player view) ===================== -->
<div id="screen-game" class="screen game-app">
  <nav class="navbar">
    <button class="btn btn-ghost btn-sm" onclick="leaveGame()">← Salir</button>
    <div class="nav-logo">
      <img src="img/logo.jpeg" alt="Rescue TCG">
      <span class="nav-logo-text" id="game-title">Partida</span>
    </div>
    <div class="nav-right">
      <span id="game-player-name" style="font-size:12px;color:var(--muted)"></span>
    </div>
  </nav>
  <div class="container" id="game-content"></div>
</div>

<!-- ===================== MODAL: New Tournament (admin only) ===================== -->
<div id="modal-new-tournament" class="modal-overlay" style="display:none" onclick="closeModal('modal-new-tournament')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>Nuevo Torneo</h3>
      <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-new-tournament')">✕</button>
    </div>
    <div class="modal-body">
      <label class="label">Nombre del torneo</label>
      <input class="input" id="nt-name" type="text" placeholder="Ej: Torneo Mensual de Commander #3">

      <label class="label">Tipo de juego</label>
      <div class="type-selector" id="nt-type-selector">
        <div class="type-card active" data-type="commander" onclick="selectType('commander')">
          <div class="type-icon">🧙</div>
          <div class="type-label">Commander</div>
          <div class="type-sub">Pods de 4</div>
        </div>
        <div class="type-card" data-type="standard" onclick="selectType('standard')">
          <div class="type-icon">🃏</div>
          <div class="type-label">Standard</div>
          <div class="type-sub">Bo3 · 1v1</div>
        </div>
        <div class="type-card" data-type="beyblade" onclick="selectType('beyblade')">
          <div class="type-icon">🌀</div>
          <div class="type-label">Beyblade</div>
          <div class="type-sub">Bo3 · 1v1</div>
        </div>
      </div>

      <div id="nt-format-row" style="display:none">
        <label class="label">Formato</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="nt-format" value="swiss" checked> Swiss</label>
          <label class="radio-label"><input type="radio" name="nt-format" value="elimination"> Eliminación directa</label>
        </div>
      </div>

      <label class="label">Fecha del torneo</label>
      <input class="input" id="nt-date" type="date">

      <label class="label">Hora</label>
      <input class="input" id="nt-time" type="time">

      <label class="label">Descripción / lugar / premio (opcional)</label>
      <input class="input" id="nt-desc" type="text" placeholder="Ej: Tienda Rescue TCG, entrada $50, premio booster box">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-new-tournament')">Cancelar</button>
      <button class="btn btn-primary" onclick="createTournament()">Crear torneo</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: Join Tournament ===================== -->
<div id="modal-join" class="modal-overlay" style="display:none" onclick="closeModal('modal-join')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="join-title">Unirse al torneo</h3>
      <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-join')">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">¿Confirmas tu participación en este torneo?</p>
      <label class="label">Tu nombre en el torneo</label>
      <input class="input" id="join-name" type="text" placeholder="Nombre o alias">
      <div id="join-bey-row" style="display:none">
        <label class="label">Tu Beyblade</label>
        <input class="input" id="join-bey" type="text" placeholder="Nombre de tu trompo (opcional)">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-join')">Cancelar</button>
      <button class="btn btn-primary" onclick="joinTournament()">Confirmar inscripción</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/tournament.js"></script>
<script src="js/commander.js"></script>
<script src="js/swiss.js"></script>
<script src="js/elimination.js"></script>
<script src="js/game-app.js"></script>
<script src="js/realtime.js"></script>
<script src="js/app.js"></script>
</body>
</html>
